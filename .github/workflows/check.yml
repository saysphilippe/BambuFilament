name: Sjekk

# Rask sjekk på alle pull requests og push: syntaks i alle skript, og at moduler som
# importeres faktisk finnes. Ingen godkjenning fra andre kreves, så dette er sikkerhetsnettet.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Syntaks i alle skript
        run: |
          for f in *.js worker/src/*.js scripts/*.mjs; do
            node --check "$f" || exit 1
          done
      - name: Importerte moduler finnes
        run: |
          for f in app.js parts.js; do
            grep -oE 'from "\./[^"?]+' "$f" | sed 's#from "\./##' | while read -r m; do
              [ -f "$m" ] || { echo "::error file=$f::Finner ikke $m"; exit 1; }
            done
          done
      - name: Nettsidens skript er lenket
        run: grep -q 'src="app.js' index.html || { echo "::error file=index.html::app.js er ikke lenket"; exit 1; }
