name: Oppdater Bambu-katalog

on:
  schedule:
    - cron: "17 5 * * *"   # daglig 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hent farger, typer og produktsider fra Bambu Lab
        run: node scripts/update-catalog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lagre endringer
        run: |
          if git diff --quiet -- data/catalog.json data/colors.json; then
            echo "Ingen endringer"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/colors.json
          git commit -m "Oppdater Bambu-katalog"
          # Nettsiden og leserne skriver også til repoet, så hent siste versjon først.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
