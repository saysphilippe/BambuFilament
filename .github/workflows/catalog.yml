name: Oppdater Bambu-katalog og butikk

on:
  schedule:
    - cron: "17 */6 * * *"   # hver 6. time (lagerstatus endrer seg ofte)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hent farger, typer og produktsider fra Bambu Lab
        run: node scripts/update-catalog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Hent hele butikken med lagerstatus (05 og 17 UTC, eller manuelt)
        run: |
          hour=$(date -u +%H)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$hour" = "05" ] || [ "$hour" = "17" ]; then
            node scripts/update-store.mjs
          else
            echo "Hopper over butikken denne gangen"
          fi
      - name: Lagre endringer
        run: |
          if git diff --quiet -- data/catalog.json data/colors.json data/store.json; then
            echo "Ingen endringer"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/colors.json data/store.json
          git commit -m "Oppdater Bambu-katalog"
          # Nettsiden og leserne skriver også til repoet, så hent siste versjon først.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
