name = "bambufilament-proxy"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Rate limiting per IP og endepunkt (periode må være 10 eller 60 sekunder).
[[ratelimits]]
name = "AUTH_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "DATA_LIMIT"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "STORE_LIMIT"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "DB_LIMIT"
namespace_id = "1005"
simple = { limit = 300, period = 60 }

# Felles tak for /reset og /register (alle IP-er sammen), så den delte GitHub-tokenen ikke tømmes.
[[ratelimits]]
name = "PUBLIC_LIMIT"
namespace_id = "1006"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "EMAIL_LIMIT"
namespace_id = "1004"
simple = { limit = 1, period = 60 }

# GitHub-tokenen til siden, brukt til registrering og midlertidige passord på e-post.
# Legges inn av siden når administrator er innlogget. Gmail: secrets GMAIL_USER og GMAIL_APP_PASSWORD.
[[kv_namespaces]]
binding = "RESET_KV"
id = "0e498e5e33d14e12b632744ac454aead"

# Database for spoler, lån, RFID-kort, innstillinger, delte AMS/bibliotek-data, venteliste og
# innloggingsstatistikk (tabellen records, se schema.sql). Brukerliste og e-post/mobil ligger i GitHub.
[[d1_databases]]
binding = "DB"
database_name = "filament-universet"
database_id = "b37e1663-4cfc-4b40-9533-96952e18092c"

# Daglig sikkerhetskopi av databasen til BambuFilament-data (JSON), kl. 03:00 UTC.
[triggers]
crons = ["0 3 * * *"]
