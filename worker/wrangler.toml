name = "bambufilament-proxy"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Rate limiting per IP og endepunkt (periode må være 10 eller 60 sekunder).
[[ratelimits]]
name = "AUTH_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "DATA_LIMIT"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "STORE_LIMIT"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "EMAIL_LIMIT"
namespace_id = "1004"
simple = { limit = 1, period = 60 }
